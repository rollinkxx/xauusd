name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools without blanket license acceptance
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: false
      - name: Accept only the Android SDK license required for stable Android packages
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' '8933bad161af4178b1185d1a37fbf41ea5269c55' > "${ANDROID_HOME}/licenses/android-sdk-license"
      - name: Install only required Android SDK packages
        run: >-
          sdkmanager --sdk_root="${ANDROID_HOME}" --install
          'platform-tools'
          'platforms;android-36'
          'build-tools;36.0.0'
          'emulator'
          'platforms;android-35'
          'system-images;android-35;default;x86_64'
      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests, lint and APK builds
        id: build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Run emulator install and launch smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Add checksums and build metadata
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/; fi
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "versionName=1.0.0"
            echo "applicationId=com.rollinkxx.xauusd.debug"
            echo "debugApkSigning=Gradle debug keystore"
            echo "releaseApkSigning=not configured (unsigned if produced)"
            echo "builtAtUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-metadata.txt
      - name: Upload installable debug APK artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-android-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test, lint and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/connected/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 14
